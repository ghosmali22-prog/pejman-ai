# Weekly update proposals for npm packages and GitHub Actions (security fixes arrive as soon as
# they are published). Each update is a pull request that must pass all tests before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
