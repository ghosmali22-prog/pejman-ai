# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Supabase connection: the URL and the *publishable* key below are public by design —
# they ship inside the website's JavaScript anyway. The database is protected by
# Row Level Security (see supabase/migrations), not by hiding this key.
# Repository secrets with the same names, if you add them, take priority.
# NEVER put the service_role / secret key here: the "Block leaked secret keys" step fails the build if you do.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Block leaked secret keys
        run: |
          if git grep -nIE 'sb_secret_[A-Za-z0-9_-]{10,}|service_role"?\s*[:=]\s*"?eyJ|GOCSPX-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{30,}|AQ\.[A-Za-z0-9_-]{30,}' -- . ':!package-lock.json'; then
            echo "::error::A secret key was found in the repository. Remove it and rotate it in Supabase/Google."
            exit 1
          fi

      - name: Check database security rules
        run: npm run test:db

      # Tells us where Pages serves the site: "" on pejiai.com, "/pejman-ai" on github.io.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://icoiyuifywvtrlfagkdz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_gFpwndMFKSylPYd5y-r6qA_25mm-uKq' }}

      - name: Check the built site never contains a secret key
        run: |
          if grep -rlE 'sb_secret_[A-Za-z0-9_-]{20,}|GOCSPX-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|AQ\.[A-Za-z0-9_-]{30,}' dist; then
            echo "::error::The build contains a secret key." && exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
