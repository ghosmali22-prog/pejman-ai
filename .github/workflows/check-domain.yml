# Temporary diagnostic: checks DNS, Pages settings and that the live site and its assets load (re-run).
name: Check domain
on:
  push:
    paths: ['.github/workflows/check-domain.yml']
permissions:
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/pages" || true
      - run: |
          for h in pejiai.com www.pejiai.com; do echo "== $h"; dig +short A $h; dig +short CNAME $h; done
      - name: Fetch pages and every asset they reference
        run: |
          check() {
            echo "=== $1"
            final=$(curl -sS -o /tmp/p.html -w '%{http_code} %{url_effective}' -L --max-time 20 "$1") || { echo "unreachable"; return 0; }
            echo "page $final"
            grep -oE '(src|href)="[^"#]+"' /tmp/p.html | sed -E 's/^(src|href)="//; s/"$//' | grep -vE '^(https?:|mailto:|data:)' | sort -u | while read -r a; do
              u=$(python3 -c "import sys,urllib.parse;print(urllib.parse.urljoin(sys.argv[1],sys.argv[2]))" "${final#* }" "$a")
              echo "$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "$u") $u"
            done
          }
          check https://ghosmali22-prog.github.io/pejman-ai/
          check https://ghosmali22-prog.github.io/pejman-ai/admin/
          check http://pejiai.com/
          check https://pejiai.com/
          check https://www.pejiai.com/
          curl -sSI --max-time 20 https://ghosmali22-prog.github.io/pejman-ai/p/test | head -3 || true
