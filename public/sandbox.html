<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Preview</title>
    <!--
      Live preview runner for the Code section. The site always embeds this page with
      sandbox="allow-scripts" and NO allow-same-origin, so it runs in an opaque origin:
      the previewed code can run, but cannot read pejiai.com's cookies, storage or admin session,
      cannot touch the parent page, and cannot navigate the top window or open pop-ups.
      It accepts exactly one document, and only from the page that embedded it.
    -->
    <script>
      addEventListener('message', function onMessage(e) {
        if (e.source !== parent || !e.data || e.data.type !== 'pj-render' || typeof e.data.html !== 'string') return
        removeEventListener('message', onMessage)
        document.open()
        document.write(e.data.html)
        document.close()
      })
      parent.postMessage({ type: 'pj-sandbox-ready' }, '*')
    </script>
  </head>
  <body style="margin: 0; background: #fff"></body>
</html>
