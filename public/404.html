<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PEJMAN AI</title>
    <script>
      // GitHub Pages SPA trick (rafgraph/spa-github-pages):
      // turns /pejman-ai/p/my-prompt into /pejman-ai/?/p/my-prompt so index.html can restore the route.
      // Keep 1 path segment ("pejman-ai"). Set to 0 when using a custom domain.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
