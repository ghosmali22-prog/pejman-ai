<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PEJMAN AI</title>
    <script>
      // GitHub Pages SPA trick (rafgraph/spa-github-pages):
      // turns /p/my-prompt into /?/p/my-prompt so index.html can restore the route.
      // On pejiai.com the site is at the root (keep 0 segments); on *.github.io it lives under /pejman-ai/ (keep 1).
      var l = window.location
      var pathSegmentsToKeep = /\.github\.io$/.test(l.hostname) ? 1 : 0
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
